name: core-contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-core -DCROSSSHOT_BUILD_GUI=OFF
      - run: cmake --build build-core --config Debug
      - run: ctest --test-dir build-core -C Debug --output-on-failure
# Core-only compile/test does NOT validate GUI, capture, OCR or OS permissions.
